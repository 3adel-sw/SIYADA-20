<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>SIYADA</title>
<style>
:root{
  --g9:#057eff;--g8:#153a32;--g7:#1d4c41;--brass:#c9a13f;--brass-d:#8d6d16;
  --paper:#fdfdfb;--desk:#e4e9e5;--rule:#cdd6cf;--rule2:#e3e9e4;--ink:#15201d;--muted:#5a6a63;
  --blue:#1f4e8c;--blue-d:#173b6b;--red:#a63a2e;--pos:#1c6e47;--warn:#9a6700;
  --font:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.3}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
span.n{display:inline-block}
.neg{color:var(--red)}
.muted{color:var(--muted)}
.sm{font-size:.86rem}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#side{background:var(--g9);color:#d8e4de;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;border-left:1px solid #000}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{height:46px;max-width:100%;object-fit:contain;display:block;margin-bottom:10px;border-radius:3px;background:#fff;padding:3px}
.brand .co{font-size:1.18rem;font-weight:700;color:#fff;line-height:1.35;word-break:break-word}
.brand .app{margin-top:6px;font-size:.78rem;letter-spacing:.14em;color:var(--brass);font-weight:700;direction:ltr;text-align:right}
nav{padding:8px 0 20px;flex:1}
.ng{margin-top:10px}
.ng>b{display:block;padding:6px 18px;font-size:.78rem;color:#8fb0a5;font-weight:600}
.ni{display:block;padding:7px 18px 7px 12px;color:#d8e4de;border-right:3px solid transparent;font-size:.95rem}
.ni:hover{background:rgba(255,255,255,.06);text-decoration:none;color:#fff}
.ni.on{background:rgba(201,161,63,.14);border-right-color:var(--brass);color:#fff;font-weight:600}
.sfoot{padding:12px 18px;font-size:.78rem;color:#7fa093;border-top:1px solid rgba(255,255,255,.09)}
#wrap{min-width:0;display:flex;flex-direction:column}
#top{background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:10px 24px;position:sticky;top:0;z-index:20}
#top h1{font-size:1.25rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .qa{display:flex;gap:8px;flex-wrap:wrap}
#burger{display:none}
#savest{font-size:.8rem;color:var(--muted);white-space:nowrap}
#savest.bad{color:var(--red);font-weight:600}
#banner:empty{display:none}
#banner{padding:0 24px}
.bn{margin-top:14px;padding:10px 14px;border:1px solid #e0c46c;background:#fff8dc;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bn.bad{border-color:#d9a39b;background:#fdecea}
.bn span{flex:1;min-width:200px}
main{padding:20px 24px 60px;min-width:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #aebbb3;background:var(--paper);padding:6px 14px;border-radius:3px;cursor:pointer;font-size:.93rem;line-height:1.4;text-decoration:none!important;color:var(--ink);white-space:nowrap}
.btn:hover{background:#eef3ef}
.btn.primary{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#d9a39b}
.btn.danger:hover{background:#fdecea}
.btn.ghost{border-color:transparent;background:transparent}
.btn.s{padding:3px 9px;font-size:.84rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label.f{display:block;font-size:.86rem;color:var(--muted);font-weight:600}
label.f>span.req{color:var(--red)}
.in,select.in,textarea.in{display:block;width:100%;margin-top:3px;border:1px solid #aebbb3;background:#fff;border-radius:3px;padding:6px 9px;color:var(--ink);min-height:34px}
.in.n,input.n{direction:ltr;text-align:right}
textarea.in{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;margin-bottom:14px}
.frow.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.hint{font-size:.82rem;color:var(--muted);margin-top:3px;font-weight:400}
.err{color:var(--red);font-size:.88rem;margin:8px 0;white-space:pre-line}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.toolbar label.f{min-width:130px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:7px 16px;color:var(--ink);font-weight:600;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs a.on{background:var(--paper);border-color:var(--ink);border-bottom:2px solid var(--paper);margin-bottom:-2px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;border:1px solid var(--rule);background:#f1f5f2;white-space:nowrap}
.chip.ok{color:var(--pos);border-color:#a8cdb9;background:#eaf6ef}
.chip.warn{color:var(--warn);border-color:#e0c46c;background:#fff8dc}
.chip.bad{color:var(--red);border-color:#d9a39b;background:#fdecea}

/* ---------- ledger sheet (reports / lists / documents) ---------- */
.sheet{background:var(--paper);border:1px solid var(--rule);padding:22px 26px 26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 26px -16px rgba(14,40,35,.35)}
.sh{display:flex;gap:16px;align-items:center;padding-bottom:12px;margin-bottom:14px;border-bottom:3px double var(--ink)}
.sh .logo{height:54px;max-width:150px;object-fit:contain}
.sh .t{flex:1}
.sh .co{font-size:1.35rem;font-weight:800;line-height:1.3}
.sh .ti{font-size:1.05rem;font-weight:600;color:var(--g7);margin-top:2px}
.sh .meta{font-size:.84rem;color:var(--muted);text-align:left;direction:rtl;white-space:nowrap}
.sh .meta div{line-height:1.6}
.scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:.93rem}
.grid th{text-align:right;font-weight:700;font-size:.85rem;padding:7px 9px;border-bottom:2px solid var(--ink);white-space:nowrap;background:#f3f6f3}
.grid td{padding:5px 9px;border-bottom:1px solid var(--rule2);vertical-align:top}
.grid th.n,.grid td.n{text-align:right}
.grid tbody tr:hover{background:#f4f8f4}
.grid td.empty{text-align:center;color:var(--muted);padding:26px}
.grid tr.grp td{background:#eaf0ec;font-weight:700;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grid tr.sub td{font-weight:700;border-top:1px solid var(--ink)}
.grid tr.big td{font-weight:800;font-size:1.02rem}
.grid tr.dbl td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:800}
.grid tfoot tr.tot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:800;padding-top:7px;padding-bottom:7px;background:#f7f9f6}
.grid td span.n{white-space:nowrap}
.grid td.act{white-space:nowrap;text-align:left}
.grid td.wrap{white-space:normal;min-width:180px}
.grid tr.entry td{background:#f1f5f2;border-top:1px solid var(--rule);font-weight:600}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.sig{display:flex;justify-content:space-between;margin-top:46px;gap:20px}
.sig div{flex:1;text-align:center;border-top:1px solid var(--ink);padding-top:6px;font-size:.88rem;color:var(--muted)}
.words{margin-top:10px;font-weight:600}

/* ---------- dashboard ---------- */
.eq{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-end;padding:6px 2px 16px;border-bottom:3px double var(--ink);margin-bottom:18px}
.eq .t{display:flex;flex-direction:column}
.eq .t small{font-size:.84rem;color:var(--muted);font-weight:600}
.eq .t b{font-size:1.9rem;line-height:1.15;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.eq .op{font-size:1.6rem;color:var(--brass-d);font-weight:300;padding-bottom:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:22px;border:1px solid var(--rule);background:var(--paper)}
.kpi{padding:12px 16px;border-left:1px solid var(--rule)}
.kpi:last-child{border-left:0}
.kpi small{display:block;color:var(--muted);font-size:.82rem;font-weight:600}
.kpi b{display:block;font-size:1.3rem;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi a{font-size:.8rem}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;margin-bottom:22px}
.cols.e{grid-template-columns:1fr 1fr}
.panel{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:14px 18px 16px}
.panel h2{font-size:1.02rem;margin-bottom:10px}
.panel h2 small{font-weight:400;color:var(--muted);margin-right:8px}
svg.chart{width:100%;height:auto;display:block;direction:ltr}
svg.chart .bar{fill:var(--g7)}
svg.chart .bar:hover{fill:var(--brass-d)}
svg.chart .bar.cur{fill:var(--brass-d)}
svg.chart .gl{stroke:var(--rule2);stroke-width:1}
svg.chart .base{stroke:var(--ink);stroke-width:1.5}
svg.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.al ul{margin:6px 0 4px;padding:0;list-style:none}
.al li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--rule2);font-size:.9rem}
.ck{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule2);align-items:flex-start}
.ck:last-child{border-bottom:0}
.ck i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;margin-top:1px}
.ck i.ok{background:var(--pos)} .ck i.warn{background:#b88400} .ck i.bad{background:var(--red)}
.ck div{flex:1;min-width:0}
.ck small{display:block;color:var(--muted);font-size:.82rem}

/* ---------- document entry ---------- */
.doc{max-width:1100px}
.lines{width:100%;border-collapse:collapse;margin:6px 0 10px}
.lines th{font-size:.84rem;padding:6px 6px;border-bottom:2px solid var(--ink);text-align:right;background:#f3f6f3}
.lines td{padding:4px 4px;border-bottom:1px solid var(--rule2)}
.lines td.ix{width:34px;text-align:center;color:var(--muted)}
.lines input{width:100%;border:1px solid #c5d0c8;background:#fff;padding:6px 6px;border-radius:2px;min-height:32px}
.lines input:hover{border-color:#8fa398}
.lines input:focus{background:#fff;border-color:var(--blue)}
.lines .tot{font-weight:700;direction:ltr;text-align:right;white-space:nowrap}
.sumbox{margin-right:auto;max-width:360px;margin-top:6px}
.sumbox .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule2);gap:14px}
.sumbox .r.big{border-bottom:3px double var(--ink);border-top:1px solid var(--ink);font-weight:800;font-size:1.1rem;padding:7px 0}
.sumbox input{width:140px;text-align:right;direction:ltr;border:1px solid #aebbb3;border-radius:3px;padding:3px 7px}
.bal{padding:8px 12px;border:1px solid var(--rule);background:#f1f5f2;font-weight:600;margin:8px 0}
.bal.ok{border-color:#a8cdb9;background:#eaf6ef;color:var(--pos)}
.bal.bad{border-color:#d9a39b;background:#fdecea;color:var(--red)}

/* ---------- modal / toast ---------- */
#modal{display:none}
#modal.open{display:block}
.mback{position:fixed;inset:0;background:rgba(14,40,35,.55);z-index:90}
.mbox{position:fixed;z-index:91;top:8vh;left:50%;transform:translateX(-50%);width:min(520px,94vw);max-height:84vh;overflow:auto;background:var(--paper);border-top:4px solid var(--brass);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mbox.wide{width:min(860px,96vw)}
.mbox h3{padding:14px 20px 0;font-size:1.1rem}
.mbody{padding:14px 20px}
.mmsg{margin:0;line-height:1.8}
.mfoot{padding:12px 20px 16px;display:flex;gap:10px;justify-content:flex-start;border-top:1px solid var(--rule2)}
#toast{position:fixed;bottom:22px;left:22px;z-index:99;padding:10px 18px;background:var(--g9);color:#fff;border-right:4px solid var(--brass);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s;max-width:min(520px,90vw)}
#toast.show{opacity:1;transform:none}
#toast.bad{border-right-color:#e1685a;background:#5b1c14}

/* ---------- setup wizard ---------- */
#setup{display:grid;grid-template-columns:minmax(300px,2fr) 7fr;min-height:100vh;background:var(--paper)}
#setup .pane{background:var(--g9);color:#d8e4de;padding:46px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
#setup .word{font-size:clamp(3rem,7vw,4.4rem);font-weight:800;letter-spacing:.06em;color:var(--brass);direction:ltr;text-align:right;line-height:1}
#setup .pane p{margin:10px 0 0;font-size:1.05rem;line-height:1.9;max-width:34ch}
#setup .form{padding:46px clamp(20px,6vw,80px);max-width:820px}
#setup h1{font-size:1.7rem;margin-bottom:6px}
#setup .sub{color:var(--muted);margin-bottom:22px}
.logoPick{display:flex;gap:14px;align-items:center}
.logoPick img{height:54px;max-width:160px;object-fit:contain;border:1px solid var(--rule);padding:3px;background:#fff}
.ors{display:flex;align-items:center;gap:12px;margin:22px 0 12px;color:var(--muted)}
.ors:before,.ors:after{content:"";flex:1;border-top:1px solid var(--rule)}

/* ---------- responsive ---------- */
@media (max-width:1000px){.cols,.cols.e{grid-template-columns:1fr}}
@media screen and (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;right:0;top:0;z-index:60;width:272px;transform:translateX(100%);transition:transform .2s}
  body.nav #side{transform:none}
  body.nav:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  #burger{display:inline-flex}
  #top{padding:8px 14px} main{padding:14px 12px 50px} #banner{padding:0 12px}
  .sheet{padding:14px 12px}
  #setup{grid-template-columns:1fr}
  #setup .pane{padding:26px 22px}
  .sh .meta{display:none}
}

@media screen and (max-width:700px){
  #top .qa{display:none}
  #savest{display:none}
  .lines thead{display:none}
  .lines,.lines tbody{display:block}
  .lines tr.ln,.lines tr.ml{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:4px;padding:8px 0;border-bottom:1px solid var(--rule2)}
  .lines tr.ln td,.lines tr.ml td{display:block;width:auto!important;border:0;padding:0}
  .lines tr.ln td.ix{display:none}
  .lines tr.ln td:nth-child(2){grid-column:1/-1}
  .lines tr.ml td:nth-child(1){grid-column:1/-1}
  .lines tr.ml td:nth-child(2){grid-column:1/3}
  .lines tr.ml td:nth-child(3){grid-column:3/4}
  .lines tr.ml td:nth-child(4){grid-column:1/-1}
  .lines td.tot{padding-top:7px}
  .sumbox{max-width:none}
  .mbox{top:3vh;width:96vw}
}

/* ---------- print ---------- */
@media print{
  html{font-size:13px}
  body{background:#fff}
  #side,#top,#banner,.toolbar,.noprint,.pager,#toast,#modal,.tabs,td.act,th.act{display:none!important}
  #app{display:block}
  main{padding:0}
  .sheet{border:0;box-shadow:none;padding:0;margin:0}
  .grid tbody tr:hover{background:none}
  .grid th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grid tr.grp td,.grid tfoot tr.tot td,.grid tr.entry td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .scroll{overflow:visible}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  @page{size:A4;margin:12mm}
}

</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
/* ===== engine.js ===== */
/* =====================================================================
   SIYADA engine - posting rules (same rules as the SIYADA Excel ERP macro engine, no formulas anywhere)
   state -> journal (balanced entries) + derived tables + consistency checks
   ===================================================================== */
(function (root) {
'use strict';
const E = {};

const r2 = x => (x >= 0 ? Math.floor(x * 100 + 0.5000001) / 100 : -Math.floor(-x * 100 + 0.5000001) / 100);
E.r2 = r2;
const num = v => { const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : 0; };
E.num = num;

// Arabic literals used by the rules (kept in one place)
const T = {
  sales: 'مبيعات', purch: 'مشتريات', treas: 'خزينة', manual: 'يدوي', opening: 'افتتاحي', auto: 'آلي',
  cust: 'عميل', supp: 'مورد', party0: 'جهة',
  sale: 'بيع', ret: 'مرتجع', coll: 'تحصيل', disc: 'خصم', buy: 'شراء', retBuy: 'مرتجع شراء', pay: 'سداد', exp: 'مصروف', inc: 'إيراد',
  closing: 'إقفال', yes: 'نعم'
};
E.T = T;

E.defaultSettings = function () {
  return {
    company: '', taxNo: '', activity: '', branch: '0', gov: '', city: '', street: '', bldg: '', phone: '', logo: '',
    startDate: new Date().getFullYear() + '-01-01', costMode: 'avg',
    vatOn: false, vatRate: 14, vatIncl: true,
    accCash: '1101', accAR: '1201', accAP: '2101', accInv: '1301', accCogs: '5101', accSales: '4101', accSusp: '9999',
    accOpen: '3101', accRE: '3201', accVatOut: '2102', accVatIn: '1203', accExp: '5207', accInc: '4201',
    openCash: 0, closedUntil: '', etaActivity: '', alertDays: 60
  };
};

const tcodeOf = tp => ({ [T.sale]: 1, [T.ret]: 2, [T.coll]: 3, [T.disc]: 4, [T.buy]: 5, [T.retBuy]: 6, [T.pay]: 7, [T.exp]: 8, [T.inc]: 9 }[tp] || 10);
const rankOf = (src, tc) => {
  let r = tc === 5 ? 1 : (tc === 1 || tc === 6 ? 3 : 2);
  if (src === T.manual) r = 4;
  if (src === T.opening) r = 0;
  return r;
};
E.tcodeOf = tcodeOf;

/* -------------------------------------------------------------------
   build(S): S = {settings, coa, mapping, parties, items, transactions, manual, meta}
   ------------------------------------------------------------------- */
E.build = function (S) {
  const st = Object.assign(E.defaultSettings(), S.settings || {});
  const meta = S.meta || (S.meta = {});
  const M = S.mapping || { types: [], methods: [], expenses: [], incomes: [] };
  const coaMap = new Map();
  (S.coa || []).forEach(a => coaMap.set(a.code, a));
  const accName = c => (coaMap.get(c) || {}).name || '';
  const accType = c => (coaMap.get(c) || {}).type || '';

  const mapType = (src, tp) => { for (const m of M.types) if (m.src === src && m.tp === tp) return m.acc; return ''; };
  const methodAcc = txt => { if (!txt) return ''; for (const m of M.methods) if (txt.indexOf(m.key) >= 0) return m.acc; return ''; };
  const expAcc = cat => { for (const m of M.expenses) if (m.key === cat) return m.acc; return ''; };
  const incAcc = cat => { for (const m of M.incomes) if (m.key === cat) return m.acc; return ''; };

  const R = { journal: [], txInfo: new Map(), docs: [], parties: [], items: [], checks: [], counts: {}, warnings: [] };
  let nMis = 0, nPreStart = 0, nNoCost = 0, nUnmapped = 0, nNoParty = 0, nNoItem = 0, nImb = 0, mUntracked = 0;

  // ---- items (runtime copy)
  const items = (S.items || []).map(x => ({
    code: x.code, name: x.name, unit: x.unit || '', weight: num(x.weight), openQty: num(x.openQty), openCost: num(x.openCost),
    vat: (x.vat === '' || x.vat === null || x.vat === undefined || isNaN(parseFloat(x.vat))) ? -1 : num(x.vat),
    eta: x.eta || '', etaType: x.etaType || '', reorder: num(x.reorder),
    q: 0, v: 0, lastC: 0, buyQ: 0, sellQ: 0, cogs: 0, salesV: 0, lastBuy: 0, lastSell: 0, noCost: 0
  }));
  const itemMap = new Map();
  items.forEach((x, i) => { x.q = x.openQty; x.v = r2(x.openQty * x.openCost); x.lastC = x.openCost; if (!itemMap.has(x.code)) itemMap.set(x.code, i); });
  const itemIdx = c => (c && itemMap.has(c) ? itemMap.get(c) : -1);
  const itemRate = i => (i >= 0 && items[i].vat >= 0 ? items[i].vat : st.vatRate);
  const avgCost = i => { const x = items[i]; let a = 0; if (x.q > 0.0000001) a = x.v / x.q; if (a <= 0) a = x.lastC; if (a < 0) a = 0; return a; };

  // ---- parties (runtime copy)
  const parties = (S.parties || []).map(x => ({
    code: x.code, name: x.name, type: x.type, phone: x.phone || '', address: x.address || '', open: num(x.opening), limit: num(x.limit),
    priceList: x.priceList || '', dr: 0, cr: 0, last: '', cnt: 0, adhoc: false
  }));
  const pByCode = new Map(), pByName = new Map();
  parties.forEach((p, i) => { if (!pByCode.has(p.code)) pByCode.set(p.code, i); const k = p.type + '|' + p.name; if (!pByName.has(k)) pByName.set(k, i); });
  function getParty(code, nm, pty, rec) {
    let k = (code && pByCode.has(code)) ? pByCode.get(code) : -1;
    if (k < 0 && nm && pByName.has(pty + '|' + nm)) k = pByName.get(pty + '|' + nm);
    if (k < 0) {
      parties.push({ code: code || ('?' + String(parties.length + 1).padStart(4, '0')), name: nm, type: pty, phone: '', address: '', open: 0, limit: 0, priceList: '', dr: 0, cr: 0, last: '', cnt: 0, adhoc: true });
      k = parties.length - 1;
      pByCode.set(parties[k].code, k);
      if (nm) pByName.set(pty + '|' + nm, k);
      nNoParty++;
      addFlag(rec, 'طرف غير موجود في بيانات ' + (pty === T.cust ? 'العملاء' : 'الموردين'));
    }
    return k;
  }
  function addFlag(rec, txt) { rec.flags.push(txt); }

  // ---- records
  const recs = [];
  const startDate = st.startDate || '';
  (S.transactions || []).forEach(t => {
    const dr = num(t.debit), cr = num(t.credit);
    if (dr === 0 && cr === 0) return;
    let tp = t.type, src = t.source;
    if (src === T.treas) { tp = (tp && tp.indexOf(T.inc) >= 0) ? T.inc : T.exp; }
    const rec = {
      kind: 'tx', t, src, tp, tc: tcodeOf(tp), date: t.date || '', doc: t.doc || '', ic: t.itemCode || '', in: t.itemName || '',
      q: num(t.qty), cnt: num(t.pieces), pr: num(t.price), dr, cr, desc: t.desc || '', ref: t.row || 0, seq: t.seq || 0, jno: t.jno || 0, flags: [],
      pt: '', pc: '', pn: '', p: -1, acc: t.acc || ''
    };
    if ((t.mis || (t.amount !== undefined && t.amount !== null && t.amount !== '' && Math.abs(num(t.amount) - (dr + cr)) > 0.005)) && (src === T.sales || src === T.purch)) { nMis++; addFlag(rec, 'الإجمالي لا يساوي المدين/الدائن'); }
    if (src === T.sales || src === T.purch) {
      const pty = src === T.sales ? T.cust : T.supp;
      if ((t.partyName || '').length > 0 || (tp || '').length > 0) {
        rec.pt = pty;
        const k = getParty(t.partyCode || '', t.partyName || '', pty, rec);
        rec.p = k; rec.pc = parties[k].code; rec.pn = parties[k].name;
      } else return;
    } else if (src === T.treas) {
      rec.pt = T.party0; rec.pc = ''; rec.pn = t.partyName || '';
      rec.cat = rec.pn;
    } else return;
    recs.push(rec);
  });
  (S.manual || []).forEach(m => {
    const lines = (m.lines || []).filter(l => l.acc && (num(l.dr) !== 0 || num(l.cr) !== 0));
    if (!lines.length) return;
    recs.push({ kind: 'man', m, lines, src: T.manual, tp: m.type || T.manual, tc: 10, date: m.date || '', doc: m.doc || '', desc: m.desc || '', seq: m.seq || 0, jno: m.jno || 0, ref: m.ref || 0, flags: [] });
  });
  recs.forEach(r => {
    if (!r.date) { r.date = startDate; addFlag(r, 'بدون تاريخ'); }
    else if (startDate && r.date < startDate && r.src !== T.manual) { nPreStart++; addFlag(r, 'تاريخ قبل بداية الدفاتر'); }
    r.rank = rankOf(r.src, r.tc);
  });
  recs.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.rank - b.rank) || (a.seq - b.seq)));

  // ---- journal emission
  let nextJno = Math.max(num(meta.nextJno), 2);
  recs.forEach(r => { if (r.jno >= nextJno) nextJno = r.jno + 1; });
  let cur = null;
  const J = R.journal;
  function beginEntry(date, src, ref, typ, doc, desc, jno, tid) {
    cur = { tid: tid || 0, en: jno, ln: 0, date, src, ref, typ, doc, desc, sumDr: 0, sumCr: 0, startJ: J.length };
  }
  function addLine(acc, dAmt, cAmt, pc, pn, desc) {
    const x1 = r2(dAmt), x2 = r2(cAmt);
    if (x1 === 0 && x2 === 0) return;
    cur.ln++;
    J.push({ en: cur.en, ln: cur.ln, date: cur.date, acc, accName: accName(acc), dr: x1, cr: x2, desc: desc || cur.desc, doc: cur.doc, src: cur.src, ref: cur.ref, pc: pc || '', pn: pn || '', typ: cur.typ, tid: cur.tid });
    cur.sumDr += x1; cur.sumCr += x2;
  }
  function endEntry() {
    if (J.length <= cur.startJ) return false;
    const diff = r2(cur.sumDr - cur.sumCr);
    if (diff !== 0) {
      nImb++;
      if (diff > 0) addLine(st.accSusp, 0, diff, '', '', 'تسوية فرق قيد تلقائي'); else addLine(st.accSusp, -diff, 0, '', '', 'تسوية فرق قيد تلقائي');
    }
    return true;
  }
  const getJno = r => { if (!r.jno) { r.jno = nextJno++; if (r.kind === 'tx') r.t.jno = r.jno; else r.m.jno = r.jno; } return r.jno; };

  // ---- documents
  const docMap = new Map(); const docs = [];
  function docAdd(doc, tc, amt, vat, cost, date, pc, pn, meth, src, hasLine, en) {
    if (!doc) return;
    let d = docMap.get(doc);
    if (!d) { d = { doc, date, pc, pn, meth, src, en, lines: 0, s: new Array(11).fill(0), vat: 0, cost: 0 }; docMap.set(doc, d); docs.push(d); }
    d.s[tc] += amt; d.vat += vat; d.cost += cost; if (hasLine) d.lines++;
    if (!d.meth) d.meth = meth;
    if (!d.pc) { d.pc = pc; d.pn = pn; }
  }
  const setTx = (r, net, vat, cost, meth, en) => R.txInfo.set(r.t.id, { net, vat, cost, meth, jno: en, flag: r.flags.join(' | ') });

  // ---- opening entry (always entry 1)
  (function opening() {
    const d = startDate || new Date().toISOString().slice(0, 10);
    beginEntry(d, T.opening, 0, T.opening, 'OPEN-1', 'قيد افتتاحي - أرصدة بداية الدفاتر', 1);
    parties.forEach(p => {
      if (p.open !== 0) {
        if (p.type === T.cust) { if (p.open > 0) addLine(st.accAR, p.open, 0, p.code, p.name); else addLine(st.accAR, 0, -p.open, p.code, p.name); }
        else { if (p.open > 0) addLine(st.accAP, 0, p.open, p.code, p.name); else addLine(st.accAP, -p.open, 0, p.code, p.name); }
      }
    });
    let s = 0; items.forEach(x => { s += x.v; });
    if (s !== 0) { if (s > 0) addLine(st.accInv, s, 0, '', '', 'مخزون أول المدة'); else addLine(st.accInv, 0, -s, '', '', 'مخزون أول المدة'); }
    const oc = num(st.openCash);
    if (oc !== 0) { if (oc > 0) addLine(st.accCash, oc, 0, '', '', 'رصيد الخزينة أول المدة'); else addLine(st.accCash, 0, -oc, '', '', 'رصيد الخزينة أول المدة'); }
    const tot = r2(cur.sumDr - cur.sumCr);
    if (tot > 0) addLine(st.accOpen, 0, tot, '', '', 'رأس المال والأرصدة الافتتاحية');
    else if (tot < 0) addLine(st.accOpen, -tot, 0, '', '', 'رأس المال والأرصدة الافتتاحية');
    endEntry();
  })();

  function procParty(r) {
    const src = r.src, tc = r.tc, dr = r.dr, cr = r.cr, amt = dr + cr, pc = r.pc, pn = r.pn;
    const pa = src === T.purch ? st.accAP : st.accAR;
    const it = itemIdx(r.ic), qty = r.q;
    let meth = '';
    const en = getJno(r);
    beginEntry(r.date, src, r.ref, T.auto, r.doc, r.desc, en, r.t.id);
    let cnt = mapType(src, r.tp);
    if (cnt === 'AUTO') { cnt = r.acc || methodAcc(r.desc); if (!cnt) cnt = st.accCash; meth = accName(cnt); }
    if (!cnt) { cnt = st.accSusp; nUnmapped++; addFlag(r, 'نوع الحركة غير معرّف في ربط الحسابات'); }
    let net = amt, vat = 0;
    if (st.vatOn && (tc === 1 || tc === 2 || tc === 4 || tc === 5 || tc === 6)) {
      const vr = itemRate(it);
      if (vr > 0) { net = r2(amt / (1 + vr / 100)); vat = r2(amt - net); }
    }
    if (dr > 0) addLine(pa, dr, 0, pc, pn); else addLine(pa, 0, cr, pc, pn);
    const vatAcc = src === T.purch ? st.accVatIn : st.accVatOut;
    if (dr > 0) { addLine(cnt, 0, net); if (vat !== 0) addLine(vatAcc, 0, vat); }
    else { addLine(cnt, net, 0); if (vat !== 0) addLine(vatAcc, vat, 0); }
    let cost = 0;
    if (src === T.sales) {
      if (tc === 1 && it >= 0 && qty > 0) {
        const uCost = avgCost(it); cost = r2(qty * uCost);
        if (uCost <= 0) { nNoCost++; items[it].noCost++; addFlag(r, 'صنف بدون تكلفة'); }
        addLine(st.accCogs, cost, 0); addLine(st.accInv, 0, cost);
        const x = items[it]; x.q -= qty; x.v -= cost; x.sellQ += qty; x.salesV += net; x.cogs += cost; x.lastSell = r.pr;
      } else if (tc === 2 && it >= 0 && qty > 0) {
        const uCost = avgCost(it); cost = r2(qty * uCost);
        addLine(st.accInv, cost, 0); addLine(st.accCogs, 0, cost);
        const x = items[it]; x.q += qty; x.v += cost; x.sellQ -= qty; x.salesV -= net; x.cogs -= cost;
        cost = -cost;
      } else if (tc === 5) {
        if (it >= 0 && qty > 0) { const x = items[it]; x.q += qty; x.v += net; x.buyQ += qty; x.lastC = net / qty; x.lastBuy = r.pr; cost = net; }
        else mUntracked += net;
      } else if ((tc === 1 || tc === 2) && it < 0) { nNoItem++; addFlag(r, 'بدون كود صنف'); }
    } else {
      if (tc === 5) {
        if (it >= 0 && qty > 0) { const x = items[it]; x.q += qty; x.v += net; x.buyQ += qty; x.lastC = net / qty; x.lastBuy = r.pr; cost = net; }
        else { mUntracked += net; if (it < 0) addFlag(r, 'شراء بدون كود صنف: مش متتبّع في المخزون'); }
      } else if (tc === 6) {
        if (it >= 0 && qty > 0) { const x = items[it]; x.q -= qty; x.v -= net; x.buyQ -= qty; cost = -net; }
        else mUntracked -= net;
      }
    }
    endEntry();
    const p = parties[r.p];
    if (p) { p.dr += dr; p.cr += cr; p.cnt++; if (r.date > p.last) p.last = r.date; }
    docAdd(r.doc, tc, amt, vat, cost, r.date, pc, pn, meth, src, (tc === 1 || tc === 2 || tc === 5 || tc === 6), en);
    setTx(r, net, vat, cost, meth, en);
  }

  function procTreasury(r) {
    const tc = r.tc, cat = r.cat;
    const en = getJno(r);
    beginEntry(r.date, T.treas, r.ref, T.auto, r.doc, r.desc, en, r.t.id);
    let cash = r.acc || methodAcc(r.desc);
    if (!cash) cash = st.accCash;
    const meth = accName(cash);
    let amt, acc;
    if (tc === 8) {
      amt = r.cr; acc = expAcc(cat);
      if (!acc) { acc = st.accExp; addFlag(r, 'تصنيف المصروف غير موجود في ربط الحسابات'); }
      addLine(acc, amt, 0, '', cat); addLine(cash, 0, amt);
    } else {
      amt = r.dr; acc = incAcc(cat);
      if (!acc) { acc = st.accInc; addFlag(r, 'تصنيف الإيراد غير موجود في ربط الحسابات'); }
      addLine(cash, amt, 0); addLine(acc, 0, amt, '', cat);
    }
    endEntry();
    docAdd(r.doc, tc, amt, 0, 0, r.date, '', cat, meth, T.treas, true, en);
    setTx(r, amt, 0, 0, meth, en);
  }

  function procManual(r) {
    const en = getJno(r);
    beginEntry(r.date, T.manual, r.ref, r.tp || T.manual, r.doc, r.desc, en);
    r.lines.forEach(l => {
      if (!coaMap.has(l.acc)) nUnmapped++;
      addLine(l.acc, num(l.dr), num(l.cr), l.pc || '', l.pn || '', l.desc || r.desc);
    });
    endEntry();
  }

  recs.forEach(r => {
    if (r.kind === 'man') procManual(r);
    else if (r.src === T.treas) procTreasury(r);
    else procParty(r);
  });
  meta.nextJno = nextJno;

  // ---- ledger balance helpers
  const bal = new Map();
  J.forEach(l => bal.set(l.acc, (bal.get(l.acc) || 0) + l.dr - l.cr));
  const ledgerBal = a => r2(bal.get(a) || 0);
  R.bal = bal; R.ledgerBal = ledgerBal;

  // ---- outputs
  R.parties = parties.map(p => ({
    code: p.code, name: p.name, type: p.type, phone: p.phone, address: p.address, opening: p.open, debit: r2(p.dr), credit: r2(p.cr),
    balance: r2(p.type === T.cust ? p.open + p.dr - p.cr : p.open + p.cr - p.dr), limit: p.limit, last: p.last, priceList: p.priceList, count: p.cnt, adhoc: p.adhoc
  }));
  R.items = items.map(x => ({
    code: x.code, name: x.name, unit: x.unit, weight: x.weight, openQty: x.openQty, openCost: x.openCost, vat: x.vat >= 0 ? x.vat : '', eta: x.eta, etaType: x.etaType,
    bought: x.buyQ, sold: x.sellQ, onHand: r2(x.q * 1000) / 1000, avgCost: r2(avgCost(items.indexOf(x))), value: r2(x.v), reorder: x.reorder,
    lastBuy: x.lastBuy, lastSell: x.lastSell, cogs: r2(x.cogs), sales: r2(x.salesV), noCost: x.noCost
  }));
  R.docs = docs.map(d => {
    const s = d.s; const disc = s[4]; let typ, gross = 0, paid = 0;
    if (s[1] > 0) { typ = 'فاتورة بيع'; gross = s[1]; paid = s[3]; }
    else if (s[2] > 0) { typ = 'مرتجع مبيعات'; gross = s[2]; }
    else if (s[3] > 0) { typ = 'سند قبض'; gross = s[3]; paid = s[3]; }
    else if (s[5] > 0) { typ = 'فاتورة شراء'; gross = s[5]; }
    else if (s[6] > 0) { typ = 'مرتجع مشتريات'; gross = s[6]; }
    else if (s[7] > 0) { typ = 'سند دفع'; gross = s[7]; paid = s[7]; }
    else if (s[8] > 0) { typ = 'سند مصروف'; gross = s[8]; paid = s[8]; }
    else if (s[9] > 0) { typ = 'سند إيراد'; gross = s[9]; paid = s[9]; }
    else { typ = 'مستند'; gross = s[10] + disc; }
    return { doc: d.doc, date: d.date, type: typ, pc: d.pc, pn: d.pn, lines: d.lines, gross: r2(gross), discount: r2(disc), net: r2(gross - disc), paid: r2(paid), vat: r2(d.vat), cost: r2(d.cost), meth: d.meth, jno: d.en, src: d.src };
  });

  // ---- consistency checks
  const chk = (name, stat, diff, note) => R.checks.push({ name, stat, diff, note });
  const tol = (d, t) => (Math.abs(d) <= t ? 'ok' : 'bad');
  let sd = 0, sc = 0; J.forEach(l => { sd += l.dr; sc += l.cr; });
  chk('توازن دفتر القيود (مدين = دائن)', tol(sd - sc, 0.005), r2(sd - sc), 'مدين ' + fmt(sd) + ' / دائن ' + fmt(sc));
  let custSum = 0, suppSum = 0; R.parties.forEach(p => { if (p.type === T.cust) custSum += p.balance; else suppSum += p.balance; });
  const ar = ledgerBal(st.accAR);
  chk('العملاء: دفتر القيود مقابل أرصدة العملاء', tol(ar - custSum, 1), r2(ar - custSum), 'الدفتر ' + fmt(ar) + ' / العملاء ' + fmt(custSum));
  const ap = -ledgerBal(st.accAP);
  chk('الموردون: دفتر القيود مقابل أرصدة الموردين', tol(ap - suppSum, 1), r2(ap - suppSum), 'الدفتر ' + fmt(ap) + ' / الموردين ' + fmt(suppSum));
  const inv = ledgerBal(st.accInv); let ckInv = mUntracked; items.forEach(x => { ckInv += x.v; });
  chk('المخزون: الدفتر مقابل الأصناف', tol(inv - ckInv, 1), r2(inv - ckInv), 'الدفتر ' + fmt(inv) + ' / الأصناف ' + fmt(ckInv - mUntracked) + ' + بدون صنف ' + fmt(mUntracked));
  let nNC = 0, nNeg = 0; items.forEach(x => { if (x.noCost > 0) nNC++; if (x.q < -0.0005) nNeg++; });
  chk('أصناف اتباعت بدون تكلفة', nNC === 0 ? 'ok' : 'warn', nNC, 'اكتب تكلفة الوحدة الافتتاحية في بيانات الأصناف وكمّل المشتريات');
  chk('أصناف برصيد مخزون سالب', nNeg === 0 ? 'ok' : 'warn', nNeg, 'المبيعات أكبر من (الافتتاحي + المشتريات)');
  const sus = ledgerBal(st.accSusp);
  chk('الحساب المعلّق (يحتاج مراجعة)', Math.abs(sus) <= 0.005 ? 'ok' : 'warn', sus, 'رصيد الحساب ' + st.accSusp);
  chk('حركات نوعها أو طرفها غير معرّف', nUnmapped + nNoParty === 0 ? 'ok' : 'warn', nUnmapped + nNoParty, 'راجع ربط الحسابات وبيانات العملاء والموردين');
  chk('حركات بتاريخ قبل بداية الدفاتر', nPreStart === 0 ? 'ok' : 'warn', nPreStart, 'تاريخ البداية في الإعدادات');
  chk('قيود اتصحّح فرقها تلقائيًا', nImb === 0 ? 'ok' : 'bad', nImb, 'لو ظهر الرقم ده بلّغ عنه');
  chk('حركات الإجمالي فيها لا يساوي المدين/الدائن', nMis === 0 ? 'ok' : 'warn', nMis, 'راجع المبلغ المكتوب في الحركة مقابل المدين/الدائن');

  R.counts = { tx: recs.filter(r => r.kind === 'tx').length, manual: recs.filter(r => r.kind === 'man').length, lines: J.length, entries: new Set(J.map(l => l.en)).size, docs: docs.length, parties: parties.length, items: items.length, noCost: nNC, neg: nNeg };
  return R;
};

function fmt(x) { return (Math.round(x * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
E.fmt = fmt;

/* ---------- account balances for reports ---------- */
// movement of one account in [d1,d2] (ISO strings, '' = open)
E.sumAcc = function (J, acc, d1, d2) {
  let dr = 0, cr = 0;
  for (const l of J) if (l.acc === acc && (!d1 || l.date >= d1) && (!d2 || l.date <= d2)) { dr += l.dr; cr += l.cr; }
  return { dr, cr };
};

// trial balance rows: opening / movement / closing per account
E.trialBalance = function (S, R, d1, d2, onlyMoving) {
  const rows = new Map();
  (S.coa || []).forEach(a => rows.set(a.code, { code: a.code, name: a.name, type: a.type, group: a.group, od: 0, oc: 0, md: 0, mc: 0 }));
  for (const l of R.journal) {
    let r = rows.get(l.acc);
    if (!r) { r = { code: l.acc, name: l.accName || '(حساب غير معرّف)', type: '', group: '', od: 0, oc: 0, md: 0, mc: 0 }; rows.set(l.acc, r); }
    if (d1 && l.date < d1) { r.od += l.dr; r.oc += l.cr; }
    else if (!d2 || l.date <= d2) { r.md += l.dr; r.mc += l.cr; }
  }
  const out = [];
  rows.forEach(r => {
    const o = r2(r.od - r.oc), m1 = r2(r.md), m2 = r2(r.mc), c = r2(o + r.md - r.mc);
    r.openDr = o > 0 ? o : 0; r.openCr = o < 0 ? -o : 0;
    r.movDr = m1; r.movCr = m2;
    r.closeDr = c > 0 ? c : 0; r.closeCr = c < 0 ? -c : 0;
    if (!onlyMoving || r.openDr || r.openCr || r.movDr || r.movCr) out.push(r);
  });
  out.sort((a, b) => (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));
  return out;
};

/* ---------- income statement ---------- */
E.incomeStatement = function (S, R, d1, d2) {
  const st = S.settings;
  const typeOf = c => ((S.coa || []).find(a => a.code === c) || {}).type || '';
  const by = new Map();
  for (const l of R.journal) {
    if (l.typ === T.closing) continue;
    if (d1 && l.date < d1) continue;
    if (d2 && l.date > d2) continue;
    const t = typeOf(l.acc);
    if (t !== 'إيرادات' && t !== 'مصروفات') continue;
    by.set(l.acc, (by.get(l.acc) || 0) + l.cr - l.dr);
  }
  const rows = [];
  by.forEach((v, k) => rows.push({ code: k, name: ((S.coa || []).find(a => a.code === k) || {}).name || k, amount: r2(v), type: typeOf(k) }));
  rows.sort((a, b) => (a.code < b.code ? -1 : 1));
  return rows;

const DB = 'siyada_accounting_v1', KEY = 'main';
let mode = 'idb'; // idb | ls | mem
function idbOpen() {

    if (!root.indexedDB) return rej(new Error('no idb'));
    let q; try { q = indexedDB.open(DB, 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => { q.result.createObjectStore('kv'); };
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    q.onblocked = () => rej(new Error('blocked'));

      mode = 'idb'; db.close(); return v || null;
    } catch (e) {
      try { const v = root.localStorage.getItem(DB); mode = 'ls'; return v ? JSON.parse(v) : null; } catch (e2) { mode = 'mem'; return null; }
    }

  async save(state) {
    if (mode === 'idb') {

        const db = await idbOpen();
        await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(JSON.parse(JSON.stringify(state)), KEY); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });

      } catch (e) { mode = 'ls'; }
    }
    if (mode === 'ls') { try { root.localStorage.setItem(DB, JSON.stringify(state)); return true; } catch (e) { mode = 'mem'; } }
    return false;
  },
  async wipe() { try { const db = await idbOpen(); await new Promise(r => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(KEY); t.oncomplete = r; t.onerror = r; }); db.close(); } catch (e) { } try { root.localStorage.removeItem(DB); } catch (e) { } }

function typeSum(t) { let s = 0; APP.S.coa.forEach(a => { if (a.type === t) s += APP.bal(a.code); }); return s; }

function recalcInv() {
  const frm = $('#frm'); if (!frm) return; const K = KINDS[frm.dataset.kind]; let gross = 0;
  $$('#lnBody tr').forEach(tr => {
    const q = parseFloat($('.lq', tr).value) || 0, p = parseFloat($('.lp', tr).value) || 0, t = r2(q * p); gross += t; $('.lt', tr).textContent = t ? fmt(t) : '';
    const x = findItem($('.li', tr).value), lh = $('.lh', tr);
    if (x) { const r = APP.iBy.get(x.code); const bal = r ? r.onHand : 0; const out = K.lt === T.sale || K.lt === T.retBuy; lh.innerHTML = 'الرصيد: <span class="n' + (out && q > bal ? ' neg' : '') + '">' + APP.fmtq(bal) + '</span> ' + esc(x.unit || '') + (out && q > bal ? ' — الكمية أكبر من الرصيد' : ''); } else lh.textContent = '';
  });
  const disc = K.disc ? (parseFloat($('#fDisc').value) || 0) : 0, net = r2(gross - disc);
  $('#sGross').textContent = fmt(gross); $('#sNet').textContent = fmt(net);
  if (K.pay) { const paid = parseFloat($('#fPaid').value) || 0; $('#sRest').textContent = fmt(net - paid); $('#rMeth').style.opacity = paid > 0 ? 1 : .45; }
}

  recalcInv();
};

function saveInvoice(again) {
  const frm = $('#frm'), kind = frm.dataset.kind, K = KINDS[kind], edit = frm.dataset.edit, er = $('#fErr'); er.textContent = '';
  const date = $('#fD').value; if (!date) { er.textContent = 'اكتب التاريخ.'; return; }
  const p = findParty($('#fP').value, K.pty); if (!p) { er.textContent = 'اختار ' + K.partyLbl + ' من القايمة (أو سجّله الأول من شاشة ' + (K.pty === T.cust ? 'العملاء' : 'الموردين') + ').'; $('#fP').focus(); return; }
  const lines = []; let bad = '';
  $$('#lnBody tr').forEach((tr, i) => {
    const iv = $('.li', tr).value.trim(), q = parseFloat($('.lq', tr).value), pr = parseFloat($('.lp', tr).value);
    if (!iv && isNaN(q) && isNaN(pr)) return;
    const x = findItem(iv); if (!x) { bad = 'السطر ' + (i + 1) + ': الصنف مش موجود في بيانات الأصناف.'; return; }
    if (!(q > 0)) { bad = 'السطر ' + (i + 1) + ': اكتب كمية أكبر من صفر.'; return; } if (!(pr > 0)) { bad = 'السطر ' + (i + 1) + ': اكتب سعر أكبر من صفر.'; return; }
    lines.push({ x, q, pr, amt: r2(q * pr) });
  });
  if (bad) { er.textContent = bad; return; } if (!lines.length) { er.textContent = 'ضيف صنف واحد على الأقل.'; return; }
  const gross = r2(lines.reduce((s, l) => s + l.amt, 0)); const disc = K.disc ? (parseFloat($('#fDisc').value) || 0) : 0; const paid = K.pay ? (parseFloat($('#fPaid').value) || 0) : 0;
  if (disc < 0 || paid < 0) { er.textContent = 'الخصم والمدفوع لازم يكونوا أرقام موجبة.'; return; } if (disc > gross) { er.textContent = 'الخصم أكبر من إجمالي الأصناف.'; return; }
  const net = r2(gross - disc); if (paid > net + 0.004) { er.textContent = 'المدفوع أكبر من صافي المستند.'; return; }
  const doc = $('#fNo').value.trim(); if (!doc) { er.textContent = 'اكتب رقم المستند.'; return; }
  if (doc !== edit && (APP.S.transactions.some(t => t.doc === doc) || APP.S.manual.some(m => m.doc === doc))) { er.textContent = 'رقم المستند ده مستخدم قبل كده.'; return; }
  if (!APP.guard(date)) return; if (edit) { const old = APP.S.transactions.filter(t => t.doc === edit); if (old.some(t => !APP.guard(t.date))) return; }
  const finish = () => {
    if (edit) APP.S.transactions = APP.S.transactions.filter(t => t.doc !== edit);
    const base = { date, source: K.src, doc, partyType: K.pty, partyCode: p.code, partyName: p.name }; const note = $('#fDesc').value.trim(); const out = [];
    lines.forEach(l => out.push(newTx(Object.assign({}, base, { type: K.lt, side: K.side, amount: l.amt, itemCode: l.x.code, itemName: l.x.name, qty: l.q, price: l.pr, desc: note }))));
    if (disc > 0) out.push(newTx(Object.assign({}, base, { type: K.disc.tp, side: K.disc.side, amount: disc, desc: note })));
    if (paid > 0) out.push(newTx(Object.assign({}, base, { type: K.pay.tp, side: K.pay.side, amount: paid, acc: $('#fAcc').value, desc: note })));
    out.forEach(t => APP.S.transactions.push(t)); bumpDoc(doc);
    APP.UI.keepDate = date;
    if (APP.commit((edit ? 'تم تعديل ' : 'تم حفظ ') + K.title + ' ' + doc + '.', { norender: true })) { if (again && !edit) { APP.go(kind); APP.rerender(); } else APP.go('doc', doc); }
  };
  if (kind === 'sale' && p.limit > 0) { const r = APP.pBy.get(p.code); const after = (r ? r.balance : 0) + net - paid - (edit ? 0 : 0); if (after > p.limit + 0.004) { APP.confirm('الحد الائتماني للعميل ' + p.name + ' هو ' + fmt(p.limit) + '، ورصيده بعد الفاتورة هيبقى ' + fmt(after) + '. تكمل الحفظ؟', 'حفظ').then(ok => { if (ok) finish(); }); return; } }
  finish();
}

APP.alerts = function () {
  const S = APP.S, R = APP.R, days = num(S.settings.alertDays) || 60; const today = APP.today(), cut = APP.addDays(today, -days);
  const lastColl = new Map(); S.transactions.forEach(t => { if (t.type === T.coll && t.partyCode && (!lastColl.has(t.partyCode) || t.date > lastColl.get(t.partyCode))) lastColl.set(t.partyCode, t.date); });
